name: Publish

# Releases publish the dist that CI built and checked for the tagged commit; nothing is rebuilt here.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to retry (for example, v0.1.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  fetch:
    name: fetch / checked dist
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    env:
      RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
    steps:
      - name: Validate release tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+((a|b|rc)[0-9]+)?$ ]]; then
            echo "Expected a tag like v1.2.3 or v1.2.3rc1, got $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ env.RELEASE_TAG }}
          persist-credentials: false

      - name: Tag matches the package version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' pyproject.toml)
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "pyproject.toml says $version but the tag is $RELEASE_TAG" >&2
            exit 1
          fi

      - name: Download the checked CI artifact for this commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(git rev-parse HEAD)
          # Only a successful push run of ci.yml on main produces release bytes; never rebuild here, and never take
          # an artifact from a pull_request run, which anyone can trigger.
          run=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --event push --branch main \
            --commit "$sha" --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')
          if [[ -z "$run" ]]; then
            echo "No successful push CI run on main for $sha; wait for CI to finish." >&2
            exit 1
          fi
          gh run download "$run" --repo "$GITHUB_REPOSITORY" --name "$sha" --dir dist
          cd dist
          sha256sum --check --strict SHA256SUMS
          rm SHA256SUMS
          ls -la

      - uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: release-dist
          path: dist/
          if-no-files-found: error
          overwrite: true
          retention-days: 7

  pypi:
    name: publish / pypi
    needs: fetch
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/wow/
    permissions:
      id-token: write # Trusted Publishing; no stored API token
    steps:
      - uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v4.1.8
        with:
          name: release-dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@15c56dba361d8335944d31a2ecd17d700fc7bcbc # v1.12.2
        with:
          attestations: true
